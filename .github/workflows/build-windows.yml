
name: Build N-Google VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install WebView2 SDK
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory third_party/nuget

      - name: Configure CMake
        run: |
          cmake -B build -S . -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/third_party/nuget/Microsoft.Web.WebView2.1.0.2903.40"

      - name: Build VST3
        run: |
          cmake --build build --config Release --target NGoogle_VST3 --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: N-Google_Windows_x64
          path: build/NGoogle_artefacts/Release/VST3/

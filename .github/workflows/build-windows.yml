name: Build N-Google VST3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build VST3
        run: cargo xtask bundle n_google --release

      - name: Package plugin
        shell: pwsh
        run: |
          $plugin = Get-Item "target/bundled/N-Google.vst3"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path $plugin.FullName -DestinationPath "dist/N-Google_Windows_x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: N-Google_Windows_x64
          path: dist/N-Google_Windows_x64.zip
          if-no-files-found: error
